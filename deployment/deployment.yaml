apiVersion: apps/v1
kind: Deployment
metadata: {name: cardiorisk-api, namespace: cardiorisk}
spec:
  replicas: 2
  strategy: {type: RollingUpdate}
  selector: {matchLabels: {app: cardiorisk-api}}
  template:
    metadata: {labels: {app: cardiorisk-api}}
    spec:
      containers:
        - name: api
          image: cardiorisk-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 15, periodSeconds: 20}
